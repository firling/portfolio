<svg xmlns="http://www.w3.org/2000/svg" width="195" height="237" viewBox="0 0 195 237">
  <style>
    /* Logo blanc par défaut (navigateur en thème sombre). */
    /* En thème clair, on inverse le monochrome blanc -> noir pour qu'il reste visible. */
    @media (prefers-color-scheme: light) {
      image { filter: invert(1); }
    }
  </style>
  <image width="195" height="237" href="data:image/png;base64,"/>
</svg>
